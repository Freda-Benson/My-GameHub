<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameHub</title>

    <link rel="stylesheet" href="Website.CSS">
</head>

<body>

    <div class="computer-window">

        <!-- TOP BAR -->
        <header class="title-bar">

            <div class="window-icon">
                ▣
            </div>

            <h1>MyGameHub</h1>

            <div class="window-buttons">
                <button>−</button>
                <button>□</button>
                <button>×</button>
            </div>

        </header>


        <!-- MENU BAR -->
        <nav class="menu-bar">

            <a href="#">Home</a>
            <a href="#">Games</a>
            <a href="#">Videos</a>
            <a href="#">About</a>

            <div class="search">
                <input type="text" placeholder="Search games...">
                <button>🔍</button>
            </div>

        </nav>


        <!-- WEBSITE CONTENT -->
        <main class="screen">

            <div class="decoration strawberry">🍓</div>
            <div class="decoration butterfly">🦋</div>

            <section class="hero">

                <h2>Welcome to MyGameHub! 🎮</h2>

                <p>
                    Play games, discover new projects,
                    and explore the GameHub!
                </p>

            </section>


            <section class="games">

                <h2>Featured Games</h2>

                <div class="game-grid">

                    <div class="game-card">
                        <div class="game-icon">🐍</div>
                        <h3>Snake</h3>
                        <p>Eat the food and grow!</p>
                        <a href="../Game1-Snake/Snake.HTML"><button>Play</button></a>
                    </div>

                    <div class="game-card">
                        <div class="game-icon">🏓</div>
                        <h3>Ping Pong</h3>
                        <p>Can you win?</p>
                        <a href="../Game2 - PingPong/Game2.HTML"><button>Play</button></a>
                    </div>

                    <div class="game-card">
                        <div class="game-icon">🚀</div>
                        <h3>Space Game</h3>
                        <p>Explore the galaxy!</p>
                        <a href="../Game3-  Space Invaders/Game.HTML"><button>Play</button></a>
                    </div>

                </div>

            </section>

        </main>


        <!-- BOTTOM BAR -->
        <footer>
            <span>MyGameHub © 2026</span>
            <span>Made with 💜</span>
        </footer>

    </div>

</body>
</html>

</body>
</html>
